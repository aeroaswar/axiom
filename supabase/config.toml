# Supabase CLI configuration — `supabase start` gives the same stack the migrations were written for.
project_id = "axiom"

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]

[auth.email]
enable_signup = true
enable_confirmations = false

[api]
enabled = true
port = 54321
schemas = ["public", "axiom"]
extra_search_path = ["public"]

[storage]
enabled = true
