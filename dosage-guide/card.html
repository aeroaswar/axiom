<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AXIOM — Protocol Card</title>
<meta name="description" content="Print-ready AXIOM protocol card — 85 × 55 mm, front and back, with a locally generated QR that resolves to the compound guide." />
<meta name="theme-color" content="#070605" />
<meta name="robots" content="noindex" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23070605'/%3E%3Cg stroke='%23C88A4E' stroke-width='6' stroke-linecap='round' fill='none'%3E%3Cpolyline points='24,74 38,26 52,74'/%3E%3Ccircle cx='70' cy='52' r='16'/%3E%3C/g%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#070605; --ink:#F2EDE5; --muted:#9c9488; --muted-2:#6a635a;
  --line:rgba(242,237,229,.12); --line-2:rgba(242,237,229,.22);
  --accent:#C88A4E; --accent-bright:#E7B173; --accent-deep:#7C4C24;
  --accent-line:rgba(200,138,78,.34);
  --panel:#0d0b09;
  --display:"Jost","Century Gothic",system-ui,sans-serif;
  --sans:"Inter",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;

  /* Card geometry — trim 85 × 55 mm, 3 mm bleed, 4 mm safe margin */
  --cw:85mm; --ch:55mm; --bleed:3mm; --safe:4.2mm;
  --card-ink:#F2EDE5;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0908;color:var(--ink);font-family:var(--sans);line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit}

/* ================= Control panel (screen only) ================= */
.panel{
  position:sticky;top:0;z-index:30;background:rgba(7,6,5,.92);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);padding:16px 22px;
}
.panel-in{max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;gap:18px;align-items:flex-end}
.mark{display:flex;align-items:center;gap:9px;font-family:var(--display);letter-spacing:.26em;font-size:12px;text-transform:uppercase;padding-bottom:9px}
.mark svg{width:19px;height:19px}
.ctl{display:flex;flex-direction:column;gap:6px;min-width:0}
.ctl label{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted-2)}
.ctl select,.ctl input{
  background:var(--panel);border:1px solid var(--line);border-radius:3px;color:var(--ink);
  font-family:var(--sans);font-size:13px;padding:9px 11px;min-width:150px;
}
.ctl input{font-family:var(--display);letter-spacing:.02em}
.ctl select:focus,.ctl input:focus{outline:none;border-color:var(--accent-line)}
.ctl.grow{flex:1;min-width:230px}
.ctl.grow input{width:100%;min-width:0}
.toggles{display:flex;gap:16px;padding-bottom:9px;flex-wrap:wrap}
.tg{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--muted);cursor:pointer;user-select:none}
.tg input{accent-color:var(--accent);width:14px;height:14px}
.btn{
  background:linear-gradient(120deg,#E7B173,#C88A4E 55%,#9A5F2C);color:#120c06;border:none;border-radius:3px;
  font-family:var(--sans);font-weight:600;font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;
  padding:11px 20px;cursor:pointer;
}
.btn:hover{filter:brightness(1.08)}
.readout{font-size:11px;color:var(--muted-2);padding-bottom:11px;line-height:1.5;max-width:280px}
.readout b{color:var(--muted);font-weight:500}
.readout .warn{color:var(--accent-bright)}

/* ================= Stage ================= */
.stage{max-width:1180px;margin:0 auto;padding:44px 22px 90px;display:flex;flex-direction:column;gap:44px;align-items:flex-start}
.sheet-label{font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--muted-2);margin-bottom:14px}
.preview{transform-origin:top left}
.preview-box{position:relative}

/* ================= The card ================= */
.card{
  position:relative;width:var(--cw);height:var(--ch);background:#070605;color:var(--card-ink);
  overflow:hidden;flex:none;
  -webkit-print-color-adjust:exact;print-color-adjust:exact;
}
.card.bleedon{width:calc(var(--cw) + var(--bleed)*2);height:calc(var(--ch) + var(--bleed)*2)}
.card-in{
  position:absolute;inset:var(--safe);
  display:flex;flex-direction:column;
  /* Card type is set in mm; normalise the inherited line box so inline
     children do not pick up leading from the 16px page default. */
  font-size:2mm;line-height:1.4;
}
.card.bleedon .card-in{inset:calc(var(--safe) + var(--bleed))}

/* Ambient bronze wash + engraved hairlines */
.card::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(80% 120% at 100% 0%, rgba(200,138,78,.13), transparent 58%),
    radial-gradient(60% 90% at 0% 100%, rgba(124,76,36,.10), transparent 62%);
}
.card::after{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:linear-gradient(rgba(242,237,229,.028) .06mm, transparent .06mm);
  background-size:100% 1.4mm;
}

/* --- Front --- */
.f-top{display:flex;align-items:flex-start;justify-content:space-between;gap:3mm}
.wordmark{display:flex;align-items:center;gap:1.5mm}
.wordmark svg{width:3.6mm;height:3.6mm;flex:none}
.wordmark span{font-family:var(--display);font-weight:400;font-size:2.7mm;letter-spacing:.62mm;text-transform:uppercase}
.f-cat{font-size:1.75mm;letter-spacing:.5mm;text-transform:uppercase;color:var(--accent);text-align:right;padding-top:.6mm}

.f-body{display:flex;gap:4mm;flex:1;align-items:center;padding-top:2mm}
.f-left{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.f-name{font-family:var(--display);font-weight:300;font-size:7.2mm;line-height:1.08;letter-spacing:-.04mm}
.f-name.long{font-size:5.3mm}
.f-name.xlong{font-size:4.1mm}
.f-cls{font-size:1.95mm;color:var(--muted);line-height:1.45;margin-top:1.2mm;max-width:44mm}
.f-rule{height:.12mm;background:linear-gradient(90deg,var(--accent),rgba(200,138,78,.06));margin:2.4mm 0 2mm;width:26mm}
.f-badges{display:flex;gap:1.8mm}
.f-foot{display:grid;grid-template-columns:1fr auto auto;gap:4mm;align-items:end;border-top:.1mm solid rgba(242,237,229,.1);padding-top:1.6mm}
.f-foot div{min-width:0}
.f-foot span{display:block;font-size:1.4mm;letter-spacing:.32mm;text-transform:uppercase;color:var(--muted-2);margin-bottom:.5mm}
.f-foot b{display:block;line-height:1.25;font-family:var(--display);font-weight:400;font-size:1.95mm;color:var(--muted);letter-spacing:.02mm;white-space:nowrap}
.f-foot .ev b{color:var(--accent-bright)}
.badge{
  border:.12mm solid var(--accent-line);border-radius:6mm;padding:.9mm 2.2mm;
  font-size:1.65mm;letter-spacing:.36mm;text-transform:uppercase;color:var(--accent-bright);white-space:nowrap;
}
.badge.plain{border-color:var(--line);color:var(--muted)}

/* QR block */
.f-qr{flex:none;display:flex;flex-direction:column;align-items:center;gap:1.4mm;padding-bottom:.4mm}
.qr-frame{position:relative;padding:1.5mm;background:#F2EDE5;border-radius:.6mm}
.qr-frame svg{display:block;width:var(--qr,21mm);height:var(--qr,21mm)}
.qr-tick{position:absolute;width:1.6mm;height:1.6mm;border:.18mm solid var(--accent)}
.qr-tick.tl{top:-1mm;left:-1mm;border-right:0;border-bottom:0}
.qr-tick.tr{top:-1mm;right:-1mm;border-left:0;border-bottom:0}
.qr-tick.bl{bottom:-1mm;left:-1mm;border-right:0;border-top:0}
.qr-tick.br{bottom:-1mm;right:-1mm;border-left:0;border-top:0}
.qr-cap{font-size:1.55mm;letter-spacing:.3mm;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:.9mm;white-space:nowrap}
.qr-cap svg{width:1.7mm;height:1.7mm}

/* --- Back --- */
.b-head{display:flex;align-items:baseline;justify-content:space-between;gap:3mm;padding-bottom:1.8mm;border-bottom:.12mm solid rgba(242,237,229,.14)}
.b-title{font-family:var(--display);font-weight:400;font-size:3.1mm;letter-spacing:.05mm}
.b-tag{font-size:1.6mm;letter-spacing:.4mm;text-transform:uppercase;color:var(--accent)}
.b-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:2.4mm;padding:2.6mm 0}
.b-cell span{display:block;font-size:1.5mm;letter-spacing:.34mm;text-transform:uppercase;color:var(--muted-2);margin-bottom:.8mm}
.b-cell b{font-family:var(--display);font-weight:400;font-size:2.25mm;line-height:1.25;display:block;color:var(--ink)}
.b-week{display:grid;grid-template-columns:repeat(7,1fr);gap:1mm;padding-bottom:2.4mm}
.b-day{
  border:.1mm solid var(--line);border-radius:.5mm;padding:1mm 0;text-align:center;
  font-size:1.5mm;letter-spacing:.24mm;text-transform:uppercase;color:var(--muted-2);
}
.b-day.on{border-color:var(--accent-line);background:rgba(200,138,78,.16);color:var(--accent-bright)}
.b-note{font-size:1.75mm;color:var(--muted);line-height:1.5;border-top:.1mm solid rgba(242,237,229,.08);padding-top:2mm;flex:1}
.b-note b{color:var(--ink);font-weight:500}
.b-foot{display:flex;align-items:flex-end;justify-content:space-between;gap:3mm;border-top:.1mm solid rgba(242,237,229,.08);padding-top:1.8mm}
.b-scope{font-size:1.45mm;line-height:1.45;color:var(--muted-2);max-width:52mm}
.b-url{text-align:right;flex:none}
.b-url span{display:block;font-size:1.45mm;letter-spacing:.3mm;text-transform:uppercase;color:var(--muted-2);margin-bottom:.6mm}
.b-url b{display:block;line-height:1.3;font-family:var(--display);font-weight:400;font-size:1.9mm;color:var(--accent-bright);letter-spacing:.02mm;word-break:break-all}

/* --- Crop marks --- */
.cropwrap{position:relative;flex:none}
.crop{position:absolute;background:#6a635a;pointer-events:none}
.cropwrap.on{padding:5mm}
.cropwrap .card{position:relative}

/* ================= Print ================= */
@media print{
  .panel,.stage>.sheet-label,.screen-only{display:none !important}
  body{background:#fff}
  .stage{padding:0;margin:0;max-width:none;gap:0;display:block}
  .preview{transform:none !important}
  .preview-box{overflow:visible}
  .sheet{display:flex;flex-wrap:wrap;gap:0}
  .page{page-break-after:always;break-after:page}
  .page:last-child{page-break-after:auto;break-after:auto}
  @page{size:A4;margin:8mm}
}
@media screen{ .sheet{display:flex;gap:9mm;flex-wrap:wrap} }
</style>
</head>
<body>

<div class="panel">
  <div class="panel-in">
    <div class="mark">
      <svg viewBox="0 0 100 100" aria-hidden="true"><g stroke="#C88A4E" stroke-width="7" stroke-linecap="round" fill="none"><polyline points="24,74 38,26 52,74"/><circle cx="70" cy="52" r="16"/></g></svg>
      AXIOM
    </div>

    <div class="ctl">
      <label for="c-compound">Compound</label>
      <select id="c-compound"></select>
    </div>

    <div class="ctl grow">
      <label for="c-base">Guide base URL</label>
      <input id="c-base" type="text" value="https://axiom.id/g" spellcheck="false" />
    </div>

    <div class="ctl">
      <label for="c-lot">Lot / batch</label>
      <input id="c-lot" type="text" value="AX-2604-0118" spellcheck="false" />
    </div>

    <div class="ctl">
      <label for="c-ecl">QR error correction</label>
      <select id="c-ecl">
        <option value="M">M — 15%</option>
        <option value="Q" selected>Q — 25%</option>
        <option value="H">H — 30%</option>
      </select>
    </div>

    <div class="toggles">
      <label class="tg"><input type="checkbox" id="c-bleed" /> Bleed + crop marks</label>
      <label class="tg"><input type="checkbox" id="c-sheet" /> A4 imposition sheet</label>
    </div>

    <button class="btn" id="c-print">Print</button>
    <div class="readout" id="c-readout"></div>
  </div>
</div>

<div class="stage" id="stage"></div>

<script src="qr.js"></script>
<script src="compounds.js"></script>
<script>
(function () {
  "use strict";

  var DAYS = ["M", "T", "W", "T", "F", "S", "S"];
  var CAD_WORD = { daily: "Daily", weekly: "Weekly", cycle: "Cyclical", "as-needed": "As needed" };
  var QR_MM = 21;                     /* printed QR side, excluding the light frame */

  var els = {
    compound: document.getElementById("c-compound"),
    base: document.getElementById("c-base"),
    lot: document.getElementById("c-lot"),
    ecl: document.getElementById("c-ecl"),
    bleed: document.getElementById("c-bleed"),
    sheet: document.getElementById("c-sheet"),
    print: document.getElementById("c-print"),
    readout: document.getElementById("c-readout"),
    stage: document.getElementById("stage")
  };

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  window.COMPOUNDS.forEach(function (c) {
    var o = document.createElement("option");
    o.value = c.slug; o.textContent = c.name;
    els.compound.appendChild(o);
  });

  function payload(c) {
    var base = els.base.value.trim().replace(/\/+$/, "");
    return base + "/" + c.slug;
  }

  function nameClass(name) {
    if (name.length > 26) return " xlong";
    if (name.length > 13) return " long";
    return "";
  }

  var LOGO = '<svg viewBox="0 0 100 100" aria-hidden="true"><g stroke="#C88A4E" stroke-width="7" stroke-linecap="round" fill="none"><polyline points="24,74 38,26 52,74"/><circle cx="70" cy="52" r="16"/></g></svg>';

  function front(c, url) {
    var qr = QR.svg(url, { ecl: els.ecl.value, quiet: 2, dark: "#070605", light: "none" });
    var ev = window.EVIDENCE_META[c.evidence];
    return '<div class="card-in">' +
      '<div class="f-top">' +
        '<div class="wordmark">' + LOGO + "<span>Axiom</span></div>" +
        '<div class="f-cat">' + esc(c.category) + "</div>" +
      "</div>" +
      '<div class="f-body">' +
        '<div class="f-left">' +
          '<div class="f-name' + nameClass(c.name) + '">' + esc(c.name) + "</div>" +
          '<div class="f-cls">' + esc(c.cls) + "</div>" +
          '<div class="f-rule"></div>' +
          '<div class="f-badges">' +
            '<div class="badge">' + esc(CAD_WORD[c.cadence] || c.cadence) + "</div>" +
            '<div class="badge plain">' + esc(c.route.split(" / ")[0]) + "</div>" +
          "</div>" +
        "</div>" +
        '<div class="f-qr">' +
          '<div class="qr-frame">' + qr +
            '<i class="qr-tick tl"></i><i class="qr-tick tr"></i><i class="qr-tick bl"></i><i class="qr-tick br"></i>' +
          "</div>" +
          '<div class="qr-cap">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M3 8V5a2 2 0 0 1 2-2h3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3"/></svg>' +
            "Scan for protocol</div>" +
        "</div>" +
      "</div>" +
      '<div class="f-foot">' +
        "<div><span>Half-life</span><b>" + esc(c.halfLife.replace(/ \(.*\)/, "")) + "</b></div>" +
        '<div class="ev"><span>Evidence</span><b>' + esc(ev.label) + "</b></div>" +
        "<div><span>Lot</span><b>" + esc(els.lot.value || "—") + "</b></div>" +
      "</div>" +
    "</div>";
  }

  function back(c, url) {
    var week = c.days.map(function (on, i) {
      return '<div class="b-day' + (on ? " on" : "") + '">' + DAYS[i] + "</div>";
    }).join("");
    var ev = window.EVIDENCE_META[c.evidence];
    var lead = c.protocol[0];
    var noHuman = /not established|^none$/i.test(lead.v);

    return '<div class="card-in">' +
      '<div class="b-head"><div class="b-title">' + esc(c.name) + "</div>" +
        '<div class="b-tag">' + esc(CAD_WORD[c.cadence] || c.cadence) + " · " + esc(ev.label) + "</div></div>" +
      '<div class="b-grid">' +
        '<div class="b-cell"><span>Route</span><b>' + esc(c.route.split(" / ")[0]) + "</b></div>" +
        '<div class="b-cell"><span>Half-life</span><b>' + esc(c.halfLife.replace(/ \(.*\)/, "")) + "</b></div>" +
        '<div class="b-cell"><span>Lyophilised</span><b>−20 °C, dark</b></div>' +
        '<div class="b-cell"><span>Reconstituted</span><b>2–8 °C</b></div>' +
      "</div>" +
      '<div class="b-week">' + week + "</div>" +
      '<div class="b-note">' +
        (noHuman
          ? "<b>No established human dose.</b> " + esc(ev.blurb) + " Scan for what the study models actually report."
          : "<b>" + esc(lead.k) + ": " + esc(lead.v) + ".</b> " + esc(ev.blurb) + " Scan for the full schedule.") +
      "</div>" +
      '<div class="b-foot">' +
        '<div class="b-scope">Reference material for a compound supplied for research use. Not medical advice and not a prescription. ' +
          "Lot " + esc(els.lot.value || "—") + ".</div>" +
        '<div class="b-url"><span>If the code will not scan</span><b>' + esc(url.replace(/^https?:\/\//, "")) + "</b></div>" +
      "</div>" +
    "</div>";
  }

  function cropMarks() {
    var m = "";
    var corners = [
      ["top:0;left:0", "top:0;left:0"], ["top:0;right:0", "top:0;right:0"],
      ["bottom:0;left:0", "bottom:0;left:0"], ["bottom:0;right:0", "bottom:0;right:0"]
    ];
    corners.forEach(function (c) {
      m += '<i class="crop" style="' + c[0] + ';width:.12mm;height:4mm"></i>';
      m += '<i class="crop" style="' + c[1] + ';width:4mm;height:.12mm"></i>';
    });
    return m;
  }

  function cardEl(c, url, side) {
    var bleed = els.bleed.checked;
    var html = '<div class="cropwrap' + (bleed ? " on" : "") + '">' +
      (bleed ? cropMarks() : "") +
      '<div class="card' + (bleed ? " bleedon" : "") + '">' +
        (side === "front" ? front(c, url) : back(c, url)) +
      "</div></div>";
    return html;
  }

  function moduleSize(url) {
    var q = QR.encode(url, els.ecl.value);
    return { version: q.version, size: q.size, mm: QR_MM / (q.size + 4) };
  }

  function render() {
    var c = window.COMPOUNDS.filter(function (x) { return x.slug === els.compound.value; })[0];
    if (!c) return;
    var url = payload(c);

    var info;
    try { info = moduleSize(url); }
    catch (e) {
      els.readout.innerHTML = '<span class="warn">' + esc(e.message) + " Shorten the base URL.</span>";
      return;
    }

    var mm = info.mm;
    var warn = mm < 0.5
      ? '<span class="warn">Module ' + mm.toFixed(2) + " mm — below the 0.5 mm print floor. Shorten the URL or lower the ECC level.</span>"
      : "Module <b>" + mm.toFixed(2) + " mm</b> — within print tolerance.";
    els.readout.innerHTML =
      "QR <b>v" + info.version + "</b> · " + info.size + "×" + info.size + " modules · ECC <b>" + els.ecl.value + "</b><br>" +
      warn + "<br>Card <b>85 × 55 mm</b>" + (els.bleed.checked ? " + 3 mm bleed" : "");

    var html;
    if (els.sheet.checked) {
      var per = 8, i, f = "", b = "";
      for (i = 0; i < per; i++) { f += cardEl(c, url, "front"); b += cardEl(c, url, "back"); }
      html =
        '<div class="page"><div class="sheet-label">A4 imposition — front (8 up)</div><div class="preview-box"><div class="preview" data-zoom="1"><div class="sheet">' + f + "</div></div></div></div>" +
        '<div class="page"><div class="sheet-label">A4 imposition — back (8 up)</div><div class="preview-box"><div class="preview" data-zoom="1"><div class="sheet">' + b + "</div></div></div></div>";
    } else {
      html =
        '<div class="page"><div class="sheet-label">Front — 85 × 55 mm</div><div class="preview-box"><div class="preview" data-zoom="2.8"><div class="sheet">' + cardEl(c, url, "front") + "</div></div></div></div>" +
        '<div class="page"><div class="sheet-label">Back — 85 × 55 mm</div><div class="preview-box"><div class="preview" data-zoom="2.8"><div class="sheet">' + cardEl(c, url, "back") + "</div></div></div></div>";
    }
    els.stage.innerHTML = html;
    sizePreviews();
  }

  /* Scale each preview to fit the stage, and reserve its scaled footprint —
     a transform does not affect layout, so the wrapper is sized by hand. */
  function sizePreviews() {
    var avail = els.stage.clientWidth;
    Array.prototype.forEach.call(document.querySelectorAll(".preview"), function (p) {
      var box = p.parentElement;
      p.style.transform = "none";
      box.style.width = ""; box.style.height = "";
      var nat = p.getBoundingClientRect();
      if (!nat.width) return;
      var max = parseFloat(p.getAttribute("data-zoom")) || 2.8;
      var zoom = Math.min(max, avail / nat.width);
      p.style.transform = "scale(" + zoom + ")";
      box.style.width = nat.width * zoom + "px";
      box.style.height = nat.height * zoom + "px";
    });
  }

  /* Print at true size: drop the preview scaling for the duration. */
  function clearPreviewScaling() {
    Array.prototype.forEach.call(document.querySelectorAll(".preview"), function (p) {
      p.style.transform = "none";
      p.parentElement.style.width = "";
      p.parentElement.style.height = "";
    });
  }

  ["change", "input"].forEach(function (evt) {
    [els.compound, els.base, els.lot, els.ecl, els.bleed, els.sheet].forEach(function (el) {
      el.addEventListener(evt, render);
    });
  });
  els.print.addEventListener("click", function () { window.print(); });
  window.addEventListener("beforeprint", clearPreviewScaling);
  window.addEventListener("afterprint", sizePreviews);
  window.addEventListener("resize", sizePreviews);

  render();
})();
</script>
</body>
</html>
