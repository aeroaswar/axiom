<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>AXIOM — Compound Guide</title>
<meta name="description" content="AXIOM compound guide — administration cadence, when to apply, documented protocol, a dose and supply calculator, and studied benefits, with the evidence tier stated for every figure." />
<meta name="theme-color" content="#070605" />
<meta name="robots" content="noindex" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23070605'/%3E%3Cg stroke='%23C88A4E' stroke-width='6' stroke-linecap='round' fill='none'%3E%3Cpolyline points='24,74 38,26 52,74'/%3E%3Ccircle cx='70' cy='52' r='16'/%3E%3C/g%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#070605; --ink:#F2EDE5; --muted:#9c9488; --muted-2:#6a635a;
  --line:rgba(242,237,229,.12); --line-2:rgba(242,237,229,.22); --line-soft:rgba(242,237,229,.06);
  --accent:#C88A4E; --accent-bright:#E7B173; --accent-deep:#7C4C24;
  --accent-soft:rgba(200,138,78,.14); --accent-line:rgba(200,138,78,.34);
  --panel:#0d0b09; --panel-2:#131010;
  --display:"Jost","Century Gothic",system-ui,sans-serif;
  --sans:"Inter",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --pad:20px; --maxw:700px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6;
  -webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1;padding-bottom:70px;
}
a{color:inherit;text-decoration:none}
::selection{background:var(--accent);color:#0a0704}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 var(--pad)}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- Top bar ---------- */
.bar{
  position:sticky;top:0;z-index:20;background:rgba(7,6,5,.86);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line-soft);
}
.bar-in{display:flex;align-items:center;gap:14px;height:56px;max-width:var(--maxw);margin:0 auto;padding:0 var(--pad)}
.mark{display:flex;align-items:center}
.mark img{width:96px;height:auto;display:block}
.bar .back{margin-left:auto;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:7px 14px;transition:.2s}
.bar .back:hover{color:var(--ink);border-color:var(--line-2)}

/* ---------- Hero ---------- */
.hero{padding:34px 0 26px;border-bottom:1px solid var(--line-soft)}
.cat{display:inline-block;font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--accent);margin-bottom:16px}
h1{font-family:var(--display);font-weight:300;font-size:clamp(32px,8.5vw,46px);line-height:1.08;letter-spacing:-.015em}
.what{color:#d8d1c6;font-size:16px;line-height:1.6;margin-top:14px;max-width:52ch}
.cls{color:var(--muted-2);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;margin-top:12px}

/* At-a-glance strip */
.glance{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line-soft);border:1px solid var(--line-soft);border-radius:4px;margin-top:22px;overflow:hidden}
.glance div{background:var(--panel);padding:13px 15px}
.glance span{display:block;font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted-2);margin-bottom:5px}
.glance b{font-family:var(--display);font-weight:400;font-size:15px;line-height:1.3;display:block}

/* ---------- Evidence banner ---------- */
.ev{margin-top:20px;border:1px solid var(--line);border-left:2px solid var(--tone,var(--accent));border-radius:3px;background:var(--panel);padding:15px 17px}
.ev-top{display:flex;align-items:center;gap:9px;margin-bottom:7px}
.ev-dot{width:7px;height:7px;border-radius:50%;background:var(--tone,var(--accent));flex:none}
.ev-label{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;font-weight:500;color:var(--tone,var(--accent))}
.ev p{font-size:13.5px;color:var(--muted);line-height:1.62}
.tone-solid{--tone:#7FA87F}
.tone-mid{--tone:#C88A4E}
.tone-open{--tone:#9c9488}

/* ---------- Sections ---------- */
section{padding:36px 0;border-bottom:1px solid var(--line-soft)}
h2{font-family:var(--display);font-weight:400;font-size:13px;letter-spacing:.26em;text-transform:uppercase;color:var(--muted);margin-bottom:22px;display:flex;align-items:center;gap:12px}
h2::after{content:"";height:1px;background:var(--line-soft);flex:1}

/* ---------- Cadence ---------- */
.cad-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.cad-word{font-family:var(--display);font-weight:300;font-size:38px;letter-spacing:.02em;text-transform:uppercase;line-height:1;
  background:linear-gradient(120deg,#E7B173,#C88A4E 55%,#9A5F2C);-webkit-background-clip:text;background-clip:text;color:transparent}
.cad-sub{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted-2)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:16px}
.day{aspect-ratio:1;border:1px solid var(--line);border-radius:3px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3px;background:var(--panel);
  font-family:inherit;padding:0;cursor:pointer;transition:.16s}
.day:hover{border-color:var(--line-2)}
.day:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.day span{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted-2)}
.day i{width:5px;height:5px;border-radius:50%;background:var(--line-2);font-style:normal}
.day.on{border-color:var(--accent-line);background:var(--accent-soft)}
.day.on span{color:var(--accent-bright)}
.day.on i{background:var(--accent-bright);box-shadow:0 0 9px rgba(231,177,115,.65)}
.note{font-size:13.5px;color:var(--muted);line-height:1.65}

/* ---------- Timing ---------- */
.timing{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px}
.tcard{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:16px}
.tcard span{display:block;font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted-2);margin-bottom:7px}
.tcard b{font-family:var(--display);font-weight:400;font-size:17px;line-height:1.25;display:block;color:var(--accent-bright)}
.tcard.plain b{color:var(--ink)}

/* ---------- Protocol rows ---------- */
.rows{border-top:1px solid var(--line-soft)}
.row{padding:15px 0;border-bottom:1px solid var(--line-soft)}
.row-top{display:flex;justify-content:space-between;align-items:baseline;gap:16px}
.row-k{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted-2);flex:none}
.row-v{font-family:var(--display);font-size:17px;font-weight:400;text-align:right;letter-spacing:.005em}
.row-v.none{color:var(--muted);font-style:italic;font-family:var(--sans);font-size:15px}
.row-n{font-size:12.5px;color:var(--muted-2);margin-top:6px;line-height:1.6}

/* ---------- Calculator ---------- */
.calc{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:20px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{display:flex;flex-direction:column;gap:7px;min-width:0}
.field label{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted-2)}
.field input{
  background:var(--panel-2);border:1px solid var(--line);border-radius:3px;color:var(--ink);
  font-family:var(--display);font-size:17px;padding:11px 12px;width:100%;
  font-variant-numeric:tabular-nums;-moz-appearance:textfield;
}
.field input:focus{outline:none;border-color:var(--accent-line);background:#171310}
.field input::-webkit-outer-spin-button,.field input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.field input[type=date]{font-size:15px}
.out{margin-top:20px;padding-top:20px;border-top:1px solid var(--line-soft)}
.out-hero{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.out-num{font-family:var(--display);font-weight:300;font-size:46px;line-height:1;color:var(--accent-bright);font-variant-numeric:tabular-nums}
.out-unit{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.out-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px 16px;margin-top:20px}
.out-cell{border-top:1px solid var(--line-soft);padding-top:10px}
.out-cell b{display:block;font-family:var(--display);font-size:16px;font-weight:400;font-variant-numeric:tabular-nums;line-height:1.3}
.out-cell span{display:block;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted-2);margin-top:3px}
.calc-note{font-size:12px;color:var(--muted-2);margin-top:16px;line-height:1.6}
.sizes{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.size{
  border:1px solid var(--line);border-radius:3px;background:var(--panel-2);
  padding:9px 13px;cursor:pointer;text-align:left;font-family:inherit;color:var(--ink);transition:.16s;
}
.size:hover{border-color:var(--accent-line)}
.size:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.size.on{border-color:var(--accent-line);background:var(--accent-soft)}
.size b{display:block;font-family:var(--display);font-size:15px;font-weight:400}
.size span{display:block;font-size:10.5px;color:var(--muted-2);margin-top:2px;font-variant-numeric:tabular-nums}
.size.on b{color:var(--accent-bright)}
.sizes-label{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted-2);margin-top:20px}
.sd.last{border-color:var(--line-2)}
.cal-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:18px}
.btn-cal{
  background:linear-gradient(120deg,#E7B173,#C88A4E 55%,#9A5F2C);color:#120c06;border:none;border-radius:3px;
  font-family:var(--sans);font-weight:600;font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  padding:11px 18px;cursor:pointer;
}
.btn-cal:hover{filter:brightness(1.08)}
.btn-cal:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.cal-note{font-size:12px;color:var(--muted-2)}
.ics-fb{margin-top:16px;border:1px solid var(--line);border-radius:3px;background:var(--panel);padding:14px}
.ics-fb-top{font-size:12px;color:var(--muted);margin-bottom:10px}
.ics-fb textarea{
  width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:3px;color:var(--muted);
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;padding:10px;resize:vertical;margin-bottom:10px;
}
.sd.last span{color:var(--accent)}
.flag{font-size:13px;margin-top:14px;padding:11px 13px;border-radius:3px;border:1px solid var(--accent-line);background:rgba(200,138,78,.09);color:var(--accent-bright);line-height:1.55}

/* ---------- Schedule ---------- */
.sched{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.sd{border:1px solid var(--line);border-radius:3px;padding:9px 12px;background:var(--panel-2);min-width:78px}
.sd b{display:block;font-family:var(--display);font-size:15px;font-weight:400}
.sd span{display:block;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted-2);margin-top:2px}
.sd.first{border-color:var(--accent-line);background:var(--accent-soft)}
.sd.first b{color:var(--accent-bright)}

/* ---------- Lists ---------- */
ul.bul{list-style:none;display:flex;flex-direction:column;gap:13px}
ul.bul li{position:relative;padding-left:22px;font-size:14.5px;color:#d8d1c6;line-height:1.62}
ul.bul li::before{content:"";position:absolute;left:2px;top:9px;width:5px;height:5px;border:1px solid var(--accent);border-radius:50%}
ul.warn li::before{border-color:var(--muted-2);border-radius:0}
p.body{font-size:14.5px;color:#d8d1c6;line-height:1.7}

/* ---------- Scope ---------- */
.scope{padding:30px 0 10px}
.scope p{font-size:12px;color:var(--muted-2);line-height:1.7}
.scope p + p{margin-top:11px}
.scope strong{color:var(--muted);font-weight:500}

/* ---------- Index ---------- */
.idx-hero{padding:44px 0 26px}
.idx-hero h1{font-size:clamp(30px,7.5vw,42px)}
.idx-hero p{color:var(--muted);font-size:15px;margin-top:14px;max-width:46ch}
.search{margin-top:24px;position:relative}
.search input{
  width:100%;background:var(--panel);border:1px solid var(--line);border-radius:3px;color:var(--ink);
  font-family:var(--sans);font-size:15px;padding:13px 15px;
}
.search input:focus{outline:none;border-color:var(--accent-line)}
.search input::placeholder{color:var(--muted-2)}
.grp{padding:24px 0;border-bottom:1px solid var(--line-soft)}
.grp h3{font-size:10.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--accent);margin-bottom:12px}
.item{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line-soft);transition:.18s}
.item:last-child{border-bottom:none}
.item:hover{padding-left:6px}
.item-main{flex:1;min-width:0}
.item-name{font-family:var(--display);font-size:18px;font-weight:400}
.item-cls{font-size:12px;color:var(--muted-2);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-cad{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:5px 10px;flex:none}
.arrow{color:var(--muted-2);flex:none}
.empty{padding:34px 0;color:var(--muted-2);font-size:14px}

@media (min-width:560px){
  :root{--pad:28px}
  .fields{grid-template-columns:repeat(3,1fr)}
  .out-grid{grid-template-columns:repeat(5,1fr)}
  .glance{grid-template-columns:repeat(4,1fr)}
}
</style>
</head>
<body>

<div class="bar">
  <div class="bar-in">
    <a class="mark" href="index.html" aria-label="AXIOM — compound guide"><img src="assets/axiom-wordmark-white.svg" alt="AXIOM" /></a>
    <a class="back" id="back" href="index.html" hidden>All compounds</a>
  </div>
</div>

<main id="app" class="wrap"></main>

<script src="compounds.js"></script>
<script>
(function () {
  "use strict";
  var app = document.getElementById("app");
  var back = document.getElementById("back");

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }
  function param(name) {
    var m = new RegExp("[?&]" + name + "=([^&#]*)").exec(location.search);
    return m ? decodeURIComponent(m[1]) : null;
  }
  function idr(n) {
    return "Rp " + String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ".");
  }
  function fmtNum(n, dp) {
    if (!isFinite(n)) return "—";
    return (n.toFixed(dp == null ? 2 : dp).replace(/\.?0+$/, "")) || "0";
  }

  var DAYS = ["M", "T", "W", "T", "F", "S", "S"];
  var DAY_FULL = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
  var MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var CAD_WORD = { daily: "Daily", weekly: "Weekly", cycle: "In courses", "as-needed": "When needed" };
  var CAD_SUB = {
    daily: "Every day", weekly: "Same day each week",
    cycle: "A course, then a break", "as-needed": "No fixed schedule"
  };
  /* A pen kept in the fridge is conventionally finished within 28 days of
     the first dose. */
  var IN_USE_DAYS = 28;

  function addDays(d, n) { var x = new Date(d.getTime()); x.setDate(x.getDate() + n); return x; }
  function fmtDate(d) { return d.getDate() + " " + MONTHS[d.getMonth()]; }
  function weekdayIdx(d) { return (d.getDay() + 6) % 7; }        /* Mon = 0 */
  function isoOf(d) {
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") +
      "-" + String(d.getDate()).padStart(2, "0");
  }
  function parseIso(v) {
    var p = String(v).split("-");
    var d = new Date(+p[0], +p[1] - 1, +p[2]);
    return isNaN(d.getTime()) ? null : d;
  }

  /* ---------------- Index ---------------- */
  function renderIndex() {
    back.hidden = true;
    document.title = "AXIOM — Compound Guide";
    app.innerHTML =
      '<div class="idx-hero">' +
        '<div class="cat">Compound guide</div>' +
        "<h1>What it is,<br>and how to use it.</h1>" +
        "<p>Scan the card on any AXIOM pen to land here: what the compound actually does, " +
        "how often to take it, when in the day, what the evidence really says, and how many " +
        "doses are in your pen.</p>" +
        '<div class="search"><input id="q" type="search" placeholder="Search a compound, or what it is for" autocomplete="off" /></div>' +
      "</div>" +
      '<div id="list"></div>' +
      '<div class="scope"><p><strong>What this is.</strong> Reference material for compounds sold for research use. ' +
      "It is not medical advice, not a prescription, and not a recommendation to give anything to a person. " +
      "Where a compound is an approved medicine, the official doses are reproduced and named as such. Where it " +
      "is not, no dose is invented.</p></div>";

    var q = document.getElementById("q");
    var list = document.getElementById("list");

    function draw() {
      var term = q.value.trim().toLowerCase();
      var hits = window.COMPOUNDS.filter(function (c) {
        if (!term) return true;
        return (c.name + " " + c.cls + " " + c.category + " " + c.what + " " + c.cadence)
          .toLowerCase().indexOf(term) >= 0;
      });
      if (!hits.length) {
        list.innerHTML = '<div class="empty">Nothing matches “' + esc(q.value) + "”.</div>";
        return;
      }
      var groups = {}, order = [];
      hits.forEach(function (c) {
        if (!groups[c.category]) { groups[c.category] = []; order.push(c.category); }
        groups[c.category].push(c);
      });
      list.innerHTML = order.map(function (cat) {
        return '<div class="grp"><h3>' + esc(cat) + "</h3>" + groups[cat].map(function (c) {
          return '<a class="item" href="#' + encodeURIComponent(c.slug) + '">' +
            '<div class="item-main"><div class="item-name">' + esc(c.name) + "</div>" +
            '<div class="item-cls">' + esc(c.cls) + "</div></div>" +
            '<div class="item-cad">' + esc(CAD_WORD[c.cadence] || c.cadence) + "</div>" +
            '<svg class="arrow" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 12h14M13 6l6 6-6 6"/></svg>' +
            "</a>";
        }).join("") + "</div>";
      }).join("");
    }
    q.addEventListener("input", draw);
    draw();
  }

  /* ---------------- Compound ---------------- */
  function renderCompound(c) {
    back.hidden = false;
    document.title = "AXIOM — " + c.name;
    var ev = window.EVIDENCE_META[c.evidence] || window.EVIDENCE_META.preclinical;
    var iso = isoOf(new Date());

    var rows = c.protocol.map(function (r) {
      var none = /not set|not established|^none/i.test(r.v);
      return '<div class="row"><div class="row-top">' +
        '<div class="row-k">' + esc(r.k) + "</div>" +
        '<div class="row-v' + (none ? " none" : "") + '">' + esc(r.v) + "</div></div>" +
        '<div class="row-n">' + esc(r.n) + "</div></div>";
    }).join("");

    app.innerHTML =
      '<div class="hero">' +
        '<div class="cat">' + esc(c.category) + "</div>" +
        "<h1>" + esc(c.name) + "</h1>" +
        '<div class="what">' + esc(c.what) + "</div>" +
        '<div class="cls">' + esc(c.cls) + "</div>" +
        '<div class="glance">' +
          "<div><span>How often</span><b>" + esc(CAD_WORD[c.cadence] || c.cadence) + "</b></div>" +
          "<div><span>When</span><b>" + esc(c.timing.when) + "</b></div>" +
          "<div><span>How</span><b>" + esc(c.route.split(" / ")[0]) + "</b></div>" +
          "<div><span>Lasts in body</span><b>" + esc(c.halfLife.replace(/ \(.*\)/, "")) + "</b></div>" +
        "</div>" +
        '<div class="ev tone-' + ev.tone + '">' +
          '<div class="ev-top"><i class="ev-dot"></i><div class="ev-label">' + esc(ev.label) + "</div></div>" +
          "<p>" + esc(c.evidenceNote) + "</p>" +
        "</div>" +
      "</div>" +

      "<section><h2>How often</h2>" +
        '<div class="cad-head"><div class="cad-word">' + esc(CAD_WORD[c.cadence] || c.cadence) + "</div>" +
        '<div class="cad-sub">' + esc(CAD_SUB[c.cadence] || "") + "</div></div>" +
        '<div class="week" id="week"></div>' +
        '<div class="note" id="week-note"></div>' +
        '<div class="note" style="margin-top:10px">' + esc(c.cadenceNote) + "</div>" +
      "</section>" +

      "<section><h2>When to take it</h2>" +
        '<div class="timing">' +
          '<div class="tcard"><span>Time of day</span><b>' + esc(c.timing.when) + "</b></div>" +
          '<div class="tcard plain"><span>Food</span><b>' + esc(c.timing.food) + "</b></div>" +
        "</div>" +
        '<div class="note">' + esc(c.timing.note) + "</div>" +
      "</section>" +

      "<section><h2>Doses</h2><div class=\"rows\">" + rows + "</div></section>" +

      "<section><h2>Your pen</h2>" +
        '<div class="calc">' +
          '<div class="fields">' +
            '<div class="field"><label for="f-qty">Quantity (' + esc(c.pen.unit) + ')</label><input id="f-qty" type="number" inputmode="decimal" step="any" min="0" value="' + c.pen.qty + '"></div>' +
            '<div class="field"><label for="f-dose">Each dose (' + esc(c.pen.unit) + ')</label><input id="f-dose" type="number" inputmode="decimal" step="any" min="0" value="' + c.pen.dose + '"></div>' +
            '<div class="field"><label for="f-week">Doses per week</label><input id="f-week" type="number" inputmode="numeric" step="1" min="0" max="21" value="' + c.perWeek + '"></div>' +
            '<div class="field"><label for="f-date">First dose on</label><input id="f-date" type="date" value="' + iso + '"></div>' +
          "</div>" +
          '<div class="out" id="out"></div>' +
          '<div class="calc-note">Your pen comes ready to use — the mixing water is already in the quantity ' +
          "shown, so there is nothing to prepare. This works out how many doses are in your pen and how long " +
          "it lasts. It does not tell you what your dose should be.</div>" +
          '<div class="sizes-label">Sizes AXIOM sells — tap to compare</div>' +
          '<div class="sizes">' + c.sizes.map(function (z) {
            return '<button class="size" data-qty="' + z.qty + '" type="button">' +
              "<b>" + z.qty + " " + esc(z.unit) + "</b><span>" + idr(z.price) + "</span></button>";
          }).join("") + "</div>" +
        "</div>" +
        '<div id="sched-wrap"></div>' +
      "</section>" +

      "<section><h2>What it is used for</h2><ul class=\"bul\">" +
        c.benefits.map(function (b) { return "<li>" + esc(b) + "</li>"; }).join("") +
      "</ul></section>" +

      "<section><h2>Looking after it</h2>" +
        '<p class="body">' + esc(c.storage) + "</p>" +
        '<p class="body" style="margin-top:14px;color:var(--muted-2);font-size:13px">' + esc(window.HANDLING) + "</p>" +
      "</section>" +

      "<section><h2>Watch out for</h2><ul class=\"bul warn\">" +
        c.cautions.map(function (b) { return "<li>" + esc(b) + "</li>"; }).join("") +
      "</ul></section>" +

      '<div class="scope">' +
        "<p><strong>What this is.</strong> Reference material for a compound sold for research use. Not medical " +
        "advice, not a prescription, and not a recommendation to give anything to a person.</p>" +
        "<p><strong>About the doses above.</strong> " + esc(ev.blurb) + "</p>" +
        "<p>If you are thinking about using any of this, do it with a doctor who can weigh it against your own " +
        "history, your medication and what needs monitoring.</p>" +
      "</div>";

    wire(c);
  }

  /* ---------------- Interaction ---------------- */
  function wire(c) {
    var f = {
      qty: document.getElementById("f-qty"),
      dose: document.getElementById("f-dose"),
      week: document.getElementById("f-week"),
      date: document.getElementById("f-date")
    };
    var out = document.getElementById("out");
    var schedWrap = document.getElementById("sched-wrap");
    var weekEl = document.getElementById("week");
    var weekNote = document.getElementById("week-note");

    /* The week pattern is rotatable: same cadence and spacing, shifted to
       whichever day you actually start on. */
    var pattern = c.days.slice();
    var hasPattern = pattern.some(function (x) { return x; });

    function firstOn(p) { for (var i = 0; i < 7; i++) if (p[i]) return i; return 0; }
    function rotateTo(target) {
      if (!hasPattern) return;
      var shift = ((target - firstOn(pattern)) % 7 + 7) % 7;
      if (!shift) return;
      var next = new Array(7);
      for (var i = 0; i < 7; i++) next[i] = pattern[(i - shift + 7) % 7];
      pattern = next;
    }

    function drawWeek() {
      weekEl.innerHTML = pattern.map(function (on, i) {
        return '<button type="button" class="day' + (on ? " on" : "") +
          '" data-day="' + i + '" aria-pressed="' + (on ? "true" : "false") +
          '" aria-label="Move the schedule to start on ' + DAY_FULL[i] + '">' +
          "<span>" + DAYS[i] + "</span><i></i></button>";
      }).join("");
      weekNote.textContent = hasPattern
        ? "Tap a day to move the whole schedule — the spacing stays the same."
        : "Taken when needed, so there is no weekly pattern.";
    }

    weekEl.addEventListener("click", function (e) {
      var btn = e.target.closest(".day");
      if (!btn || !hasPattern) return;
      var target = +btn.getAttribute("data-day");
      rotateTo(target);
      /* Keep the start date honest: move it to the next matching day. */
      var from = parseIso(f.date.value) || new Date();
      for (var i = 0; i < 7; i++) {
        var d = addDays(from, i);
        if (weekdayIdx(d) === target) { f.date.value = isoOf(d); break; }
      }
      drawWeek();
      update();
    });

    document.querySelector(".sizes").addEventListener("click", function (e) {
      var btn = e.target.closest(".size");
      if (!btn) return;
      f.qty.value = btn.getAttribute("data-qty");
      update();
    });

    /* Picking a start date shifts the pattern onto that weekday. */
    f.date.addEventListener("change", function () {
      var d = parseIso(f.date.value);
      if (d && hasPattern) { rotateTo(weekdayIdx(d)); drawWeek(); }
    });

    var doseDates = [];

    function update() {
      var qty = parseFloat(f.qty.value), d = parseFloat(f.dose.value), perWeek = parseFloat(f.week.value);

      Array.prototype.forEach.call(document.querySelectorAll(".size"), function (b) {
        b.classList.toggle("on", parseFloat(b.getAttribute("data-qty")) === qty);
      });

      if (!(qty > 0) || !(d > 0)) {
        out.innerHTML = '<div class="flag">Enter the quantity in your pen and the size of each dose.</div>';
        schedWrap.innerHTML = ""; doseDates = [];
        return;
      }
      if (d > qty) {
        out.innerHTML = '<div class="flag">A ' + fmtNum(d, 2) + " " + esc(c.pen.unit) +
          " dose is bigger than the " + fmtNum(qty, 2) + " " + esc(c.pen.unit) + " in the pen.</div>";
        schedWrap.innerHTML = ""; doseDates = [];
        return;
      }

      var doses = Math.floor(qty / d);
      var leftover = qty - doses * d;
      var days = perWeek > 0 ? doses / perWeek * 7 : null;
      var unit = esc(c.pen.unit);

      var start = parseIso(f.date.value) || new Date();
      doseDates = [];
      if (hasPattern) {
        /* Cap the projection so an unusual dose cannot render hundreds of
           chips; the count above still reports the true number of doses. */
        var cap = Math.min(doses, 120);
        for (var i = 0; i < 900 && doseDates.length < cap; i++) {
          var day = addDays(start, i);
          if (pattern[weekdayIdx(day)]) doseDates.push(day);
        }
      }
      var lastDose = doseDates.length ? doseDates[doseDates.length - 1] : null;
      var discard = addDays(start, IN_USE_DAYS);

      var flags = "";
      if (leftover > 0.0001) flags += '<div class="flag">' + fmtNum(leftover, 2) + " " + unit +
        " is left over after " + doses + " full doses — not enough for another one this size.</div>";

      out.innerHTML =
        '<div class="out-hero"><div class="out-num tnum">' + doses + "</div>" +
        '<div class="out-unit">doses in this pen at ' + fmtNum(d, 2) + " " + unit + "</div></div>" +
        '<div class="out-grid">' +
          '<div class="out-cell"><b class="tnum">' + fmtNum(qty, 2) + " " + unit + "</b><span>In the pen</span></div>" +
          '<div class="out-cell"><b class="tnum">' + fmtNum(d, 2) + " " + unit + "</b><span>Each dose</span></div>" +
          '<div class="out-cell"><b class="tnum">' + (perWeek > 0 ? fmtNum(d * perWeek, 2) + " " + unit : "—") + "</b><span>Each week</span></div>" +
          '<div class="out-cell"><b class="tnum">' + (days ? Math.round(days) + " days" : "—") + "</b><span>Pen lasts</span></div>" +
          '<div class="out-cell"><b>' + (lastDose ? fmtDate(lastDose) : fmtDate(discard)) + "</b><span>" +
            (lastDose ? "Last dose" : "Finish by") + "</span></div>" +
        "</div>" + flags;

      drawSchedule(c, doses, d);
    }

    /* Every dose date, through to the end of the pen. */
    function drawSchedule(c, doses, dose) {
      if (!hasPattern) {
        schedWrap.innerHTML = '<div class="note" style="margin-top:22px">' +
          "Taken when needed, so there are no dates to plan.</div>";
        return;
      }
      var cells = doseDates.map(function (day, i) {
        var last = i === doseDates.length - 1;
        return '<div class="sd' + (i === 0 ? " first" : "") + (last ? " last" : "") + '">' +
          "<b>" + fmtDate(day) + "</b><span>" +
          (last ? "Last" : DAY_FULL[weekdayIdx(day)]) + "</span></div>";
      }).join("");

      schedWrap.innerHTML =
        '<h2 style="margin-top:34px">Your dose dates</h2>' +
        '<div class="sched">' + cells + "</div>" +
        '<div class="cal-row">' +
          '<button class="btn-cal" id="ics" type="button">Add to calendar</button>' +
          '<span class="cal-note">' + doseDates.length + " dose" + (doseDates.length === 1 ? "" : "s") +
          (doseDates.length ? ", ending " + fmtDate(doseDates[doseDates.length - 1]) : "") + "</span>" +
        "</div>" +
        (doseDates.length < doses
          ? '<div class="note" style="margin-top:12px">Showing the first ' + doseDates.length +
            " of " + doses + " doses.</div>"
          : "") +
        '<div class="note" style="margin-top:14px">Every dose in this pen, from your start date. ' +
        "Tap a day above to move the whole run — the gaps between doses stay the same.</div>" +
        '<div id="ics-fallback"></div>';

      document.getElementById("ics").addEventListener("click", function () {
        downloadIcs(c, dose);
      });
    }

    /* ---- Calendar export ---- */
    function icsText(c, dose) {
      function esc2(t) { return String(t).replace(/([,;\\])/g, "\\$1").replace(/\n/g, "\\n"); }
      function stamp(d) {
        return d.getUTCFullYear() + String(d.getUTCMonth() + 1).padStart(2, "0") +
          String(d.getUTCDate()).padStart(2, "0") + "T" +
          String(d.getUTCHours()).padStart(2, "0") + String(d.getUTCMinutes()).padStart(2, "0") +
          String(d.getUTCSeconds()).padStart(2, "0") + "Z";
      }
      function dayStamp(d) {
        return d.getFullYear() + String(d.getMonth() + 1).padStart(2, "0") + String(d.getDate()).padStart(2, "0");
      }
      var now = stamp(new Date());
      var lines = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//AXIOM//Compound Guide//EN",
                   "CALSCALE:GREGORIAN", "METHOD:PUBLISH",
                   "X-WR-CALNAME:" + esc2("AXIOM — " + c.name)];
      doseDates.forEach(function (d, i) {
        lines.push("BEGIN:VEVENT");
        lines.push("UID:axiom-" + c.slug + "-" + dayStamp(d) + "-" + i + "@axiom");
        lines.push("DTSTAMP:" + now);
        lines.push("DTSTART;VALUE=DATE:" + dayStamp(d));
        lines.push("DTEND;VALUE=DATE:" + dayStamp(addDays(d, 1)));
        lines.push("SUMMARY:" + esc2(c.name + " " + fmtNum(dose, 2) + " " + c.pen.unit));
        lines.push("DESCRIPTION:" + esc2(
          "Dose " + (i + 1) + " of " + doseDates.length + ". " +
          "When: " + c.timing.when + ". Food: " + c.timing.food + "."));
        lines.push("END:VEVENT");
      });
      lines.push("END:VCALENDAR");
      return lines.join("\r\n");
    }

    function downloadIcs(c, dose) {
      var text = icsText(c, dose);
      var fallback = document.getElementById("ics-fallback");
      try {
        var blob = new Blob([text], { type: "text/calendar;charset=utf-8" });
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url;
        a.download = "axiom-" + c.slug + ".ics";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
      } catch (err) { /* fall through to the copy panel below */ }

      /* Some embedded viewers block downloads outright. Offer the file's
         text so it can still be saved by hand. */
      if (window.self !== window.top) {
        fallback.innerHTML = '<div class="ics-fb"><div class="ics-fb-top">If nothing downloaded, ' +
          "copy this and save it as a file ending in .ics</div>" +
          "<textarea readonly rows=\"5\"></textarea>" +
          '<button class="btn-cal" id="ics-copy" type="button">Copy</button></div>';
        fallback.querySelector("textarea").value = text;
        document.getElementById("ics-copy").addEventListener("click", function () {
          var ta = fallback.querySelector("textarea");
          ta.select();
          try { document.execCommand("copy"); this.textContent = "Copied"; } catch (e) { this.textContent = "Select and copy"; }
        });
      }
    }

    Object.keys(f).forEach(function (k) { f[k].addEventListener("input", update); });
    drawWeek();
    /* Line the pattern up with today's weekday on first load. */
    if (hasPattern) { rotateTo(weekdayIdx(new Date())); drawWeek(); }
    update();
  }

  /* ---------------- Route ----------------
     Slug comes from ?c= on a hosted site, or from the hash when the page is
     opened somewhere that cannot change the query string. */
  function route() {
    var slug = param("c") || decodeURIComponent(location.hash.replace(/^#/, ""));
    var found = slug && window.COMPOUNDS.filter(function (x) { return x.slug === slug; })[0];
    if (found) renderCompound(found);
    else renderIndex();
    window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", route);
  route();
})();
</script>
</body>
</html>
