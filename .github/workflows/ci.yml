name: gates

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: axiom
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/axiom
      AXIOM_DB_LOCAL: '1'
      AXIOM_SEED_DEV: '1'
      # The browser gates sign in as seeded users; the door is inlined by the build below.
      NEXT_PUBLIC_AUTH_MODE: dev
      AUTH_SECRET: ci-secret
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      # No `version:` — the action reads `packageManager` from package.json, and naming a version
      # in both places is a hard error in action-setup v4.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Database — migrate and seed (identical migrations to Supabase)
        run: pnpm db:reset
      - name: Static gates — typecheck, copy lint (9), greps (1, 13), bilingual (17)
        run: pnpm typecheck && pnpm gates:lint && pnpm gates:grep && node scripts/gates/i18n.mjs
      - name: Database gates — 2, 2b, 3, 4, 5, 6, 11, 12, 14, 22, RLS on every table
        run: pnpm gates:sql
      - name: Gate 8 — every reference resolves
        run: pnpm gates:refs
      - name: Build
        run: pnpm build
      - name: Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser gates — 6, 7, 10, 14, 15, 16, 18, 19, 20, 21
        run: pnpm exec playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: playwright-report, retention-days: 7 }
