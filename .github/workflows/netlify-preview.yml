# Deploys the checked-out ref to a Netlify site through Netlify's own uploader, which builds it on
# Netlify's build system with the site's environment variables. Dispatched by hand with the one-time
# proxy credential the Netlify MCP issues for the site; nothing is stored in the repository.
name: netlify-preview
on:
  workflow_dispatch:
    inputs:
      site_id:
        description: Netlify site id
        required: true
        default: f0cc6e6e-3ab7-4dcb-9a54-945f40f21569
      proxy_path:
        description: One-time proxy path issued by the Netlify MCP deploy command
        required: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Upload to Netlify and build there
        run: npx -y @netlify/mcp@latest --site-id "${{ inputs.site_id }}" --proxy-path "${{ inputs.proxy_path }}"
